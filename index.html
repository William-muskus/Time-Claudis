<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TIME CLAUDIS — Montmartre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --amber:#FFC24A; --red:#FF4438; --white:#FFF6E4; --blue:#5EC8E5;
    --ink:#14101B; --ink-soft:rgba(20,16,27,.72);
    --stroke:3px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#14101B;
    font-family:'Barlow Condensed',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;user-select:none;cursor:none}
  canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}

  /* ---------------------------------------------------------------- HUD */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:10;
    text-transform:uppercase;letter-spacing:.03em}

  .hud-top{position:absolute;top:0;left:0;right:0;display:flex;
    align-items:flex-start;justify-content:space-between;
    padding:clamp(10px,2vw,22px) clamp(12px,2.5vw,30px)}

  .panel .label,.timer-wrap .label{
    font-size:clamp(11px,1.15vw,15px);font-weight:700;color:var(--amber);
    opacity:.9;letter-spacing:.16em;margin-bottom:2px;
    text-shadow:0 2px 0 rgba(0,0,0,.55)}

  .panel .value{font-family:'Archivo Black',sans-serif;
    font-size:clamp(26px,3.4vw,46px);line-height:.92;color:var(--white);
    text-shadow:0 var(--stroke) 0 var(--ink),0 0 22px rgba(255,194,74,.35)}

  .timer-wrap{text-align:center;flex:0 0 auto}
  .timer{font-family:'Archivo Black',sans-serif;
    font-size:clamp(44px,6.2vw,86px);line-height:.86;color:var(--white);
    text-shadow:0 4px 0 var(--ink),0 0 30px rgba(255,194,74,.45)}
  .timer.critical{color:var(--red);animation:pulse .48s steps(2,end) infinite;
    text-shadow:0 4px 0 var(--ink),0 0 34px rgba(255,68,56,.75)}
  @keyframes pulse{0%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}

  .lives-panel{text-align:right}
  .lives{display:flex;gap:7px;justify-content:flex-end;margin-top:3px}
  .lives i{width:clamp(15px,1.7vw,22px);height:clamp(15px,1.7vw,22px);
    background:var(--red);display:block;
    clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%);
    box-shadow:0 2px 0 var(--ink);transition:opacity .16s,transform .16s}
  .lives i.lost{opacity:.16;transform:scale(.72)}

  /* ------------------------------------------------------------- combo */
  .combo{position:absolute;top:clamp(96px,12vh,150px);left:50%;
    transform:translateX(-50%) scale(.8);opacity:0;
    font-family:'Archivo Black',sans-serif;color:var(--amber);
    font-size:clamp(18px,2.3vw,32px);
    text-shadow:0 3px 0 var(--ink);transition:opacity .12s,transform .12s}
  .combo.show{opacity:1;transform:translateX(-50%) scale(1)}

  /* ------------------------------------------------------------ bottom */
  .hud-bottom{position:absolute;bottom:0;left:0;right:0;
    display:flex;align-items:flex-end;justify-content:space-between;
    padding:clamp(12px,2.2vw,26px) clamp(12px,2.5vw,30px)}

  .cover-state{min-width:clamp(160px,20vw,260px)}
  .cover-bar{height:clamp(9px,1.1vw,14px);background:rgba(20,16,27,.6);
    border:2px solid var(--ink);overflow:hidden}
  .cover-fill{height:100%;width:0%;background:var(--amber);
    transition:width .04s linear}
  .cover-state.exposed .cover-fill{background:var(--red)}
  .cover-state.covered .cover-fill{background:var(--blue)}
  .cover-label{font-weight:700;font-size:clamp(12px,1.3vw,17px);
    color:var(--white);margin-top:4px;letter-spacing:.14em;
    text-shadow:0 2px 0 var(--ink)}
  .cover-state.covered .cover-label{color:var(--blue)}
  .cover-state.exposed .cover-label{color:var(--red)}

  .ammo-wrap{text-align:right;min-width:clamp(150px,18vw,240px)}
  .weapon-name{font-weight:700;color:var(--amber);
    font-size:clamp(12px,1.3vw,17px);letter-spacing:.16em;
    text-shadow:0 2px 0 var(--ink)}
  .ammo{display:flex;gap:5px;justify-content:flex-end;margin:5px 0 4px}
  .ammo i{width:clamp(6px,.72vw,9px);height:clamp(18px,2.1vw,27px);
    background:var(--amber);display:block;border-radius:2px 2px 0 0;
    box-shadow:0 2px 0 var(--ink);transition:opacity .1s,transform .1s}
  .ammo i.spent{opacity:.15;transform:scaleY(.55);transform-origin:bottom}
  .ammo.numeric{font-family:'Archivo Black',sans-serif;color:var(--amber);
    font-size:clamp(20px,2.4vw,32px);display:block;
    text-shadow:0 3px 0 var(--ink)}
  .ammo.empty{animation:pulse .38s steps(2,end) infinite}
  .reload-bar{height:5px;background:rgba(20,16,27,.6);border:2px solid var(--ink)}
  .reload-fill{height:100%;width:0;background:var(--blue);transition:width .04s linear}

  /* --------------------------------------------------------- crosshair */
  .crosshair{position:absolute;left:50%;top:50%;
    transform:translate(-50%,-50%);width:64px;height:64px;
    will-change:left,top}
  .ch-ring{fill:none;stroke:var(--white);stroke-width:2.4;opacity:.92}
  .ch-tick{stroke:var(--white);stroke-width:3.2;stroke-linecap:round}
  .ch-dot{fill:var(--red)}
  .crosshair svg{filter:drop-shadow(0 2px 2px rgba(0,0,0,.75))}
  /* In cover the crosshair COLLAPSES rather than merely changing colour —
     shape survives a busy amber frame where a hue shift does not. */
  .crosshair.covered{transform:translate(-50%,-50%) scale(.55);opacity:.4}
  .crosshair.covered .ch-dot{fill:var(--blue)}
  .crosshair.empty .ch-ring{stroke:var(--red);stroke-dasharray:5 5}
  .crosshair.empty .ch-dot{fill:none}

  /* ------------------------------------------------------------ banner */
  .banner{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.6);
    font-family:'Archivo Black',sans-serif;
    font-size:clamp(34px,6.4vw,92px);letter-spacing:.02em;
    opacity:0;white-space:nowrap;color:var(--white);
    text-shadow:0 6px 0 var(--ink),0 0 46px rgba(255,194,74,.55)}
  .banner.show{opacity:1;transform:translate(-50%,-50%) scale(1);
    animation:slam .2s cubic-bezier(.2,1.7,.4,1)}
  @keyframes slam{0%{transform:translate(-50%,-50%) scale(1.9);opacity:0}
                  60%{transform:translate(-50%,-50%) scale(.94);opacity:1}
                  100%{transform:translate(-50%,-50%) scale(1)}}
  .banner.action{color:var(--amber)}
  .banner.clear{color:var(--blue)}
  .banner.fail{color:var(--red)}
  .banner.reload{color:var(--red);font-size:clamp(26px,4vw,56px)}

  /* ------------------------------------------------------------ popups */
  .popups{position:absolute;inset:0}
  .popup{position:absolute;font-family:'Archivo Black',sans-serif;
    font-size:clamp(15px,1.7vw,24px);color:var(--amber);
    text-shadow:0 3px 0 var(--ink);animation:rise 1.1s ease-out forwards;
    white-space:nowrap}
  .popup.head{color:var(--white);font-size:clamp(18px,2.1vw,30px)}
  .popup.bonus{color:var(--blue)}
  @keyframes rise{0%{opacity:0;transform:translateY(14px) scale(.7)}
                  18%{opacity:1;transform:translateY(0) scale(1.12)}
                  30%{transform:translateY(0) scale(1)}
                  100%{opacity:0;transform:translateY(-52px) scale(.95)}}

  .hit-flash{position:absolute;inset:0;opacity:0;pointer-events:none;
    background:radial-gradient(ellipse at center,transparent 34%,rgba(200,20,15,.82) 100%)}

  /* ------------------------------------------------------------- hints */
  .gesture-hint{position:absolute;left:50%;bottom:clamp(70px,11vh,120px);
    transform:translateX(-50%);display:flex;gap:clamp(12px,2vw,30px);
    padding:9px 16px;background:var(--ink-soft);border:2px solid rgba(255,194,74,.35);
    transition:opacity .6s}
  .gesture-hint.faded{opacity:0}
  .gh-row{display:flex;flex-direction:column;align-items:center;gap:1px}
  .gh-row b{color:var(--amber);font-size:clamp(12px,1.25vw,16px);letter-spacing:.13em}
  .gh-row span{color:var(--white);opacity:.75;font-size:clamp(10px,1vw,13px);
    letter-spacing:.05em;text-transform:none}

  /* ------------------------------------------------------------ camera */
  #cam-wrap{position:fixed;right:14px;top:50%;transform:translateY(-50%);
    width:clamp(120px,13vw,190px);z-index:11;pointer-events:none;
    border:2px solid rgba(255,194,74,.4);background:#0c0a11;
    box-shadow:0 6px 24px rgba(0,0,0,.5)}
  #cam-wrap.hidden{display:none}
  #cam,#cam-overlay{display:block;width:100%;transform:scaleX(-1)}
  #cam-overlay{position:absolute;inset:0}
  #cam-status{position:absolute;bottom:0;left:0;right:0;
    font-size:11px;font-weight:700;letter-spacing:.1em;text-align:center;
    padding:3px;color:var(--ink);background:var(--amber);text-transform:uppercase}
  #cam-status.lost{background:var(--red);color:var(--white)}

  /* -------------------------------------------------------- title card */
  #title{position:fixed;inset:0;z-index:20;display:flex;
    flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at 50% 40%,#2b2035 0%,#14101B 70%);
    text-align:center;padding:24px;transition:opacity .5s}
  #title.gone{opacity:0;pointer-events:none}
  #title h1{font-family:'Archivo Black',sans-serif;margin:0;
    font-size:clamp(40px,8.5vw,120px);color:var(--amber);line-height:.9;
    letter-spacing:.01em;text-shadow:0 7px 0 var(--ink),0 0 60px rgba(255,194,74,.4)}
  #title h2{font-family:'Barlow Condensed',sans-serif;font-weight:700;
    margin:10px 0 0;font-size:clamp(15px,2.1vw,28px);color:var(--white);
    letter-spacing:.34em;text-transform:uppercase;opacity:.88}
  #title .route{margin-top:6px;color:var(--blue);letter-spacing:.14em;
    font-size:clamp(12px,1.4vw,17px);text-transform:uppercase;opacity:.8}
  #start{margin-top:34px;pointer-events:auto;cursor:pointer;
    font-family:'Archivo Black',sans-serif;font-size:clamp(16px,2vw,26px);
    padding:15px 40px;border:3px solid var(--amber);background:transparent;
    color:var(--amber);letter-spacing:.12em;text-transform:uppercase;
    transition:background .15s,color .15s}
  #start:hover{background:var(--amber);color:var(--ink)}
  #title .note{margin-top:20px;color:var(--white);opacity:.45;
    font-size:clamp(11px,1.15vw,14px);letter-spacing:.06em;
    text-transform:none;max-width:46ch;line-height:1.5}
</style>
</head>
<body>
  <canvas id="gl"></canvas>
  <div id="hud-root"></div>

  <div id="cam-wrap" class="hidden">
    <video id="cam" autoplay playsinline muted></video>
    <canvas id="cam-overlay"></canvas>
    <div id="cam-status">no hand</div>
  </div>

  <div id="title">
    <h1>TIME CLAUDIS</h1>
    <h2>Montmartre</h2>
    <div class="route">Lamarck&ndash;Caulaincourt &rarr; Abbesses</div>
    <button id="start">Insert Coin</button>
    <div class="note">
      Point your index finger at the screen to aim. Curl your middle finger to
      fire. Raise the gun to the sky to duck behind cover and reload.
      Needs a webcam.
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
